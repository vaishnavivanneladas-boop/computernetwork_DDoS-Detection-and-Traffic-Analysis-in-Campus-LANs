project:
  name: ddos-campus-lab

# All addresses and interfaces below belong only to Mininet namespaces and
# virtual links. The edge link has no upstream connection and no NAT is enabled.
topology:
  interface_prefix: dcl
  nodes:
    core_switch: dclCore
    campus_router: dclRtr
    edge: dclEdge
  vlans:
    10:
      name: server_dmz
      subnet: 10.10.10.0/24
      gateway: 10.10.10.1
    20:
      name: faculty_admin
      subnet: 10.10.20.0/24
      gateway: 10.10.20.1
    30:
      name: student_lab
      subnet: 10.10.30.0/24
      gateway: 10.10.30.1
  hosts:
    student:
      node: dclStudent
      ip: 10.10.30.10
      vlan: 30
    faculty:
      node: dclFaculty
      ip: 10.10.20.10
      vlan: 20
    legitimate_client:
      node: dclLegit
      ip: 10.10.30.20
      vlan: 30
    attack:
      node: dclAttack
      ip: 10.10.30.30
      vlan: 30
    web_server:
      node: dclWeb
      ip: 10.10.10.100
      vlan: 10
  edge_transit:
    subnet: 172.16.1.0/30
    router_ip: 172.16.1.1
    edge_ip: 172.16.1.2
  http:
    port: 80
    response: Campus Mininet web server is online.

# These are experiment parameters for the isolated Mininet lab, not recommended
# production thresholds or universally optimal values.
rate_limit:
  enabled: true
  syn_rate: 5/second
  burst: 10
  destination_port: 80
  experimental_parameter: true

traffic:
  legitimate_rate_requests_per_second: 30
  legitimate_duration_seconds: 30
  legitimate_timeout_seconds: 3
  syn_packet_count: 50
  syn_rate_packets_per_second: 5
  syn_duration_seconds: 10
  syn_packet_size_bytes: 64
  experimental_parameters: true

detection:
  sustained_window_seconds: 10
  sampling_interval_seconds: 1
  required_consecutive_samples: 3
  thresholds:
    syn_rate_packets_per_second: 10
    syn_ack_ratio: 3.0
    cpu_utilization_percent: 70
    memory_utilization_percent: 75
    dropped_packets: 5
    http_failure_percent: 10
    http_response_time_ms: 1000
  weights:
    syn_rate_high: 2
    handshake_imbalance: 2
    cpu_high: 1
    memory_high: 1
    drops_high: 2
    http_failure_high: 2
    response_time_high: 1
  risk_levels:
    suspicious_minimum: 2
    high_minimum: 4
    critical_minimum: 7